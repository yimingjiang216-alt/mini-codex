[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-codex"
version = "0.1.0"
description = "A minimal coding agent reimplemented from openai/codex architecture"
requires-python = ">=3.9"

[project.scripts]
mini-codex = "mini_codex.cli:main"

[tool.setuptools.packages.find]
include = ["mini_codex*"]
